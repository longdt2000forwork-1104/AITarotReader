server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-tarot-reader-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.fiesdwuqiowkcktbrrvh}
    password: ${SPRING_DATASOURCE_PASSWORD:41331295tryth}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME:noreply@aitarotreader.com}}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  auth:
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "capacitor://localhost"
      - "http://localhost"
      - "https://localhost"
      - "https://ai-tarot-reader-delta.vercel.app"
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  tarot:
    daily-draw-free-per-day: 1
    default-crystal-reward: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
