server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-tarot-reader-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_tarot_reader}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:4c9b83b8e4e73b499120612948c21a367d2645f7823b49826a3c617b32817d23f6e1239841}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "capacitor://localhost"
      - "http://localhost"
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
  tarot:
    daily-draw-free-per-day: 1
    default-crystal-reward: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
