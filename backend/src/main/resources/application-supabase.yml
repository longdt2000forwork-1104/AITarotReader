spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    # Supabase provides JDBC URL in: Project Settings -> Database -> Connection string -> JDBC
    # Format: jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?user=postgres.[PROJECT-REF]&password=[PASSWORD]&sslmode=require
    # Or Direct: jdbc:postgresql://db.[PROJECT-REF].supabase.co:5432/postgres?sslmode=require
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require}}
    username: ${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 60000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        temp:
          use_jdbc_metadata_defaults: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
