name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Frontend Mobile App URL (Vercel)'
        required: true
        default: 'https://ai-tarot-reader-delta.vercel.app/app/home'
        type: string

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Capacitor URL & fallback webDir
        working-directory: frontend
        run: |
          mkdir -p out
          cat <<'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>AI Tarot Reader</title>
          </head>
          <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #FAF9F6; color: #0F172A; text-align: center; padding: 24px;">
            <div>
              <h2>Không thể kết nối máy chủ</h2>
              <p>Vui lòng kiểm tra kết nối Internet và mở lại ứng dụng.</p>
            </div>
          </body>
          </html>
          EOF
          cat <<EOF > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.aitarotreader.app',
            appName: 'AI Tarot Reader',
            webDir: 'out',
            server: {
              url: '${{ inputs.app_url }}',
              cleartext: false,
              androidScheme: 'https',
            },
            plugins: {
              CapacitorCookies: {
                enabled: true,
              },
              CapacitorHttp: {
                enabled: true,
              },
              SocialLogin: {
                providers: {
                  google: true,
                  facebook: false,
                  apple: false,
                  twitter: false,
                },
              },
            },
          };

          export default config;
          EOF

      - name: Setup & sync Capacitor Android
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Restore fixed debug keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Restored fixed debug keystore from ANDROID_DEBUG_KEYSTORE_BASE64."
          else
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 not set; Gradle will generate a temporary debug.keystore."
          fi

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Print APK signing SHA-1
        working-directory: frontend
        run: |
          echo "=== APK Signing Certificate (Copy SHA-1 to Google Cloud Console) ==="
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1:|SHA256:" || keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tarot-reader-latest-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
