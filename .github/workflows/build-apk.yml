name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API Base URL'
        required: true
        default: 'https://ai-tarot-backend-2jsg.onrender.com'
        type: string
      use_mock:
        description: 'Use Mock API (true/false)'
        required: true
        default: 'false'
        type: string

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure environment & prepare static export
        working-directory: frontend
        run: |
          cat <<EOF > .env.production
          NEXT_PUBLIC_USE_MOCK_API=${{ inputs.use_mock }}
          NEXT_PUBLIC_API_URL=${{ inputs.api_url }}
          EOF
          rm -rf src/app/api

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build

      - name: Setup & sync Capacitor Android
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tarot-reader-latest-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
