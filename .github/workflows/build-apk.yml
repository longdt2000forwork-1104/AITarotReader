name: Build Android APK (Offline Standalone)

on:
  push:
    branches:
      - feat/mock-data-toggle
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: frontend
        env:
          NEXT_PUBLIC_USE_MOCK_API: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:8080"
        run: |
          echo "NEXT_PUBLIC_USE_MOCK_API=true" > .env.production
          echo "NEXT_PUBLIC_API_URL=http://localhost:8080" >> .env.production
          npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true

      - name: Prepare APK File
        run: |
          ls -lh frontend/android/app/build/outputs/apk/debug/app-debug.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ai-tarot-reader-offline.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tarot-reader-apk
          path: ai-tarot-reader-offline.apk
          retention-days: 14

      - name: Publish GitHub Release with Direct Download Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feat/mock-data-toggle' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-mock-apk
          name: "AI Tarot Reader — Offline APK Preview"
          body: |
            ## Bản build APK thử nghiệm (Offline Mock Data)
            - **Tải trực tiếp về điện thoại Android**: Bấm vào file `ai-tarot-reader-offline.apk` trong mục Assets bên dưới để tải và cài đặt.
            - **Tính năng**: Hoạt động hoàn toàn Offline 100%, tích hợp giao diện rút bài hàng ngày, bàn làm việc Tarot (rút bài, luận giải, clarifier card, chat, nhật ký).
          draft: false
          prerelease: false
          make_latest: "true"
          files: ai-tarot-reader-offline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
